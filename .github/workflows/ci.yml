name: CI

# Сборка была только в деплое, то есть первую ошибку компиляции ловил прод.
# Здесь проверяем то же самое до выкладки: типы обеих половин и сборку Mini App.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22' # как на VPS
          cache: npm

      - run: npm ci

      # клиент Prisma генерируется из схемы, без него не соберётся сервер
      - run: npx prisma generate
        working-directory: server

      - name: Сборка сервера (ровно та же команда, что в деплое)
        run: npm run build -w server

      # цепочка миграций проверяется отдельно от схемы: тесты поднимают базу
      # через `db push`, то есть по ИТОГОВОЙ схеме, и не заметили бы, что
      # migrate deploy на живой базе падает или расходится со схемой
      - name: Миграции с нуля и совпадение со схемой
        run: |
          rm -f /tmp/ci-migrate.db
          DATABASE_URL="file:/tmp/ci-migrate.db" npx prisma migrate deploy
          DATABASE_URL="file:/tmp/ci-migrate.db" npx prisma migrate diff \
            --from-url "file:/tmp/ci-migrate.db" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        working-directory: server

      # список тестов раньше был перечислен в package.json руками: новый файл
      # мог лежать в репозитории и ни разу не запуститься, а CI оставался зелёным.
      # Теперь команда сама находит все src/**/*.test.ts
      - name: Тесты сервера (планировщик, синк, модерация, прогрев, безопасность…)
        run: npm run test -w server

      - name: Тесты Mini App (vitest)
        run: npm run test -w web

      - name: Сборка Mini App (внутри свой tsc)
        run: npm run build -w web

      - name: Уязвимости в зависимостях прода
        run: npm audit --omit=dev --audit-level=high

  # Сквозной путь человека: добавил книгу → выдал → очередь → вернул → оценил.
  # Отдельной джобой: качает браузер и поднимает настоящий сервер, поэтому идёт
  # дольше основной проверки и не должен задерживать её результат.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        working-directory: server

      - run: npx playwright install --with-deps chromium

      - name: Сквозные проверки (Playwright)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
